name: Status

# En gång om dygnet. Skriver STATUS.md och committar den.
#
# Utöver att vara läsbar fyller commiten en funktion: GitHub stänger av
# schemalagda arbetsflöden i repon som legat stilla i 60 dagar, och ett arkiv
# som bara rullar på ser stilla ut. En commit om dygnet håller schemat vid liv.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

concurrency:
  group: status
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skriv STATUS.md
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KONTAKT: ${{ secrets.KONTAKT }}
        run: python3 src/status.py

      - name: Committa om något ändrats
        run: |
          git config user.name "trafikkamerarkivet"
          git config user.email "actions@github.com"
          git add STATUS.md
          git diff --staged --quiet && echo "oförändrad" && exit 0
          git commit -m "Status $(date -u +%Y-%m-%d)"
          git push
