name: Packa

# Var sjätte timme, strax efter att perioden tagit slut. Udda minut för att
# inte ligga i samma kö som alla andras heltimmesjobb.
on:
  schedule:
    - cron: "23 0,6,12,18 * * *"
  workflow_dispatch:

concurrency:
  group: packa
  cancel-in-progress: false

jobs:
  packa:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libsvtav1 \
            && echo "KODEK=av1" >> $GITHUB_ENV \
            || { echo "libsvtav1 saknas, faller tillbaka på h265"; echo "KODEK=h265" >> $GITHUB_ENV; }

      - name: Komprimera bufferten och ladda upp till archive.org
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          IA_ACCESS: ${{ secrets.IA_ACCESS }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KONTAKT: ${{ secrets.KONTAKT }}
        run: python3 src/pack.py
