name: Svep

# Begär var 5:e minut för att få ut var 15:e.
#
# GitHub prioriterar ner täta scheman. Uppmätt över ett dygn gav "*/15" i
# praktiken ett svep var 38:e minut, med glapp upp till 65. Att begära var
# 5:e är inte ett försök att köra oftare än vi behöver — det är vad som
# krävs för att landa nära den takt vi faktiskt vill ha.
#
# Ojämna mellanrum gör inget för arkivet: vi sparar Trafikverkets egen
# PhotoTime, inte när vi råkade fråga.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Två svep samtidigt skulle hämta samma bilder två gånger. Köa i stället för
# att avbryta — ett svep som redan börjat ska få bli klart.
concurrency:
  group: svep
  cancel-in-progress: false

jobs:
  svep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta nya kamerabilder till bufferten
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KONTAKT: ${{ secrets.KONTAKT }}
          TRV_NYCKEL: ${{ secrets.TRV_NYCKEL }}
        run: python3 src/sweep.py
